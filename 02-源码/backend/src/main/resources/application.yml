server:
  port: ${SERVER_PORT:8083}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: manhole-repair
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/new_014?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: '123456'
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.city.manhole.entity

app:
  jwt:
    secret: manhole-repair-new014-secret-key-please-change-in-production-2026
    expire-hours: 12
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  seed-dir: ./uploads/seed

logging:
  level:
    root: warn
    com.city.manhole: info
