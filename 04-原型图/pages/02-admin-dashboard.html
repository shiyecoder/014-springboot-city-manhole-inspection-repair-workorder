<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 管理员</title>
<link rel="stylesheet" href="../assets/app.css">
<style>
  .content{padding:18px 24px}
  .pagehead{margin-bottom:12px}
  .pagehead h1{font-size:20px}
  .metrics{margin-bottom:12px}
  .metric{padding:11px 14px}
  .metric .v{font-size:24px;line-height:30px}
  .chart{height:196px}
  .card{padding:16px 18px}
  .card-h{margin-bottom:8px}
  .row2{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
  .legend{display:flex;gap:12px;font-size:11.5px;color:#5C6B63;flex-wrap:wrap}
  .legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px}
</style>
</head>
<body data-role="admin" data-active="工作台">
<div class="layout">
  <div class="main">
    <div class="content">
      <div class="pagehead">
        <div>
          <h1>工作台</h1>
          <p>数据截止 2026-10-31 20:00 · 统计范围：全市 6 个养护片区 / 最近 30 天</p>
        </div>
        <div class="right">
          <select class="select" style="width:150px"><option>最近 30 天</option><option>本月</option><option>本季度</option><option>本年</option></select>
          <a class="btn" href="16-analysis.html">统计分析</a>
          <a class="btn primary" href="08-issue-list.html">快速上报</a>
        </div>
      </div>

      <div class="metrics">
        <div class="metric"><div class="k">设施总数</div><div class="v">2,486<small>座</small></div><div class="d">本月新增 18 座</div></div>
        <div class="metric warn"><div class="k">异常井盖</div><div class="v">37<small>座</small></div><div class="d up">较上月 +6 座</div></div>
        <div class="metric"><div class="k">平均响应时长</div><div class="v">2.4<small>小时</small></div><div class="d down">较上月 -0.6 小时</div></div>
        <div class="metric"><div class="k">维修完成率</div><div class="v">92.8<small>%</small></div><div class="d down">较上月 +1.9%</div></div>
        <div class="metric danger"><div class="k">重复报修率</div><div class="v">8.6<small>%</small></div><div class="d up">较上月 +1.2%</div></div>
        <div class="metric"><div class="k">高风险路段</div><div class="v">5<small>条</small></div><div class="d">重大 2 / 紧急 3</div></div>
      </div>

      <div class="row2">
        <div class="card">
          <div class="card-h"><h3>问题上报与完成趋势</h3><div class="right legend"><span><i style="background:#234E3B"></i>上报</span><span><i style="background:#7FA08F"></i>关闭</span></div></div>
          <div class="chart">
            <svg viewBox="0 0 560 196" preserveAspectRatio="none">
              <g stroke="#EDF2EF" stroke-width="1"><line x1="36" y1="20" x2="550" y2="20"/><line x1="36" y1="60" x2="550" y2="60"/><line x1="36" y1="100" x2="550" y2="100"/><line x1="36" y1="140" x2="550" y2="140"/><line x1="36" y1="168" x2="550" y2="168"/></g>
              <g font-size="10" fill="#8A9990"><text x="18" y="24">60</text><text x="18" y="64">45</text><text x="18" y="104">30</text><text x="18" y="144">15</text></g>
              <polyline points="48,132 96,120 144,126 192,104 240,112 288,88 336,96 384,72 432,80 480,60 528,68 550,58" fill="none" stroke="#7FA08F" stroke-width="2" stroke-dasharray="4 3"/>
              <polyline points="48,120 96,108 144,116 192,92 240,100 288,76 336,86 384,64 432,70 480,50 528,58 550,46" fill="none" stroke="#234E3B" stroke-width="2.2"/>
              <g fill="#234E3B"><circle cx="48" cy="120" r="2.6"/><circle cx="192" cy="92" r="2.6"/><circle cx="336" cy="86" r="2.6"/><circle cx="480" cy="50" r="2.6"/></g>
              <g font-size="10" fill="#8A9990"><text x="44" y="184">9/1</text><text x="140" y="184">9/8</text><text x="236" y="184">9/15</text><text x="332" y="184">9/22</text><text x="428" y="184">9/29</text><text x="510" y="184">10/6</text></g>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>工单状态分布</h3></div>
          <div class="chart" style="display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 196 196" style="width:170px;height:170px">
              <circle cx="98" cy="98" r="64" fill="none" stroke="#E3EBE6" stroke-width="22"/>
              <circle cx="98" cy="98" r="64" fill="none" stroke="#234E3B" stroke-width="22" stroke-dasharray="141 261" transform="rotate(-90 98 98)"/>
              <circle cx="98" cy="98" r="64" fill="none" stroke="#3A7D5A" stroke-width="22" stroke-dasharray="68 334" stroke-dashoffset="-141" transform="rotate(-90 98 98)"/>
              <circle cx="98" cy="98" r="64" fill="none" stroke="#B7791F" stroke-width="22" stroke-dasharray="44 358" stroke-dashoffset="-209" transform="rotate(-90 98 98)"/>
              <circle cx="98" cy="98" r="64" fill="none" stroke="#A93226" stroke-width="22" stroke-dasharray="25 377" stroke-dashoffset="-253" transform="rotate(-90 98 98)"/>
              <text x="98" y="94" text-anchor="middle" font-size="11" fill="#8A9990">在办工单</text>
              <text x="98" y="118" text-anchor="middle" font-size="24" font-weight="600" fill="#1F2A25">124</text>
            </svg>
          </div>
          <div class="legend" style="justify-content:center;margin-top:-6px"><span><i style="background:#234E3B"></i>待派单 38</span><span><i style="background:#3A7D5A"></i>维修中 32</span><span><i style="background:#B7791F"></i>待验收 21</span><span><i style="background:#A93226"></i>返工 8</span></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>问题类型构成</h3></div>
          <div class="chart">
            <svg viewBox="0 0 260 196">
              <g font-size="10.5" fill="#5C6B63">
                <text x="0" y="26">破损</text><rect x="46" y="14" width="150" height="14" rx="3" fill="#234E3B"/><text x="204" y="26" fill="#1F2A25" font-weight="600">96</text>
                <text x="0" y="56">沉降</text><rect x="46" y="44" width="108" height="14" rx="3" fill="#3A7D5A"/><text x="204" y="56" fill="#1F2A25" font-weight="600">69</text>
                <text x="0" y="86">松动</text><rect x="46" y="74" width="76" height="14" rx="3" fill="#315F4C"/><text x="204" y="86" fill="#1F2A25" font-weight="600">48</text>
                <text x="0" y="116">异响</text><rect x="46" y="104" width="48" height="14" rx="3" fill="#7FA08F"/><text x="204" y="116" fill="#1F2A25" font-weight="600">31</text>
                <text x="0" y="146">丢失</text><rect x="46" y="134" width="26" height="14" rx="3" fill="#A93226"/><text x="204" y="146" fill="#1F2A25" font-weight="600">17</text>
                <text x="0" y="176">井圈破损</text><rect x="46" y="164" width="18" height="14" rx="3" fill="#B7791F"/><text x="204" y="176" fill="#1F2A25" font-weight="600">12</text>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <div class="row3">
        <div class="card">
          <div class="card-h"><h3>责任单位处置时效</h3><span class="muted">平均小时</span></div>
          <div class="chart" style="height:170px">
            <svg viewBox="0 0 300 170">
              <g font-size="10.5" fill="#5C6B63">
                <text x="0" y="22">市政一处</text><rect x="66" y="11" width="120" height="13" rx="3" fill="#234E3B"/><text x="192" y="22" fill="#1F2A25">1.8</text>
                <text x="0" y="50">市政二处</text><rect x="66" y="39" width="146" height="13" rx="3" fill="#3A7D5A"/><text x="192" y="50" fill="#1F2A25">2.2</text>
                <text x="0" y="78">排水公司</text><rect x="66" y="67" width="172" height="13" rx="3" fill="#315F4C"/><text x="192" y="78" fill="#1F2A25">2.6</text>
                <text x="0" y="106">通信管线</text><rect x="66" y="95" width="204" height="13" rx="3" fill="#7FA08F"/><text x="192" y="106" fill="#1F2A25">3.1</text>
                <text x="0" y="134">供电公司</text><rect x="66" y="123" width="232" height="13" rx="3" fill="#B7791F"/><text x="192" y="134" fill="#1F2A25">3.6</text>
              </g>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>风险分级结果分布</h3></div>
          <div class="chart" style="height:170px">
            <svg viewBox="0 0 300 170">
              <g stroke="#EDF2EF"><line x1="30" y1="20" x2="290" y2="20"/><line x1="30" y1="70" x2="290" y2="70"/><line x1="30" y1="120" x2="290" y2="120"/></g>
              <g>
                <rect x="52" y="62" width="42" height="88" rx="3" fill="#A93226"/><text x="73" y="154" text-anchor="middle" font-size="10.5" fill="#5C6B63">重大</text><text x="73" y="56" text-anchor="middle" font-size="11" fill="#A93226" font-weight="600">24</text>
                <rect x="122" y="40" width="42" height="110" rx="3" fill="#B7791F"/><text x="143" y="154" text-anchor="middle" font-size="10.5" fill="#5C6B63">紧急</text><text x="143" y="34" text-anchor="middle" font-size="11" fill="#B7791F" font-weight="600">38</text>
                <rect x="192" y="88" width="42" height="62" rx="3" fill="#2C6E8F"/><text x="213" y="154" text-anchor="middle" font-size="10.5" fill="#5C6B63">一般</text><text x="213" y="82" text-anchor="middle" font-size="11" fill="#2C6E8F" font-weight="600">62</text>
              </g>
            </svg>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>片区问题热力</h3><span class="muted">按未关闭数</span></div>
          <div class="chart" style="height:170px">
            <svg viewBox="0 0 300 170">
              <g>
                <rect x="10" y="12" width="86" height="42" rx="4" fill="#C6DFCE"/><text x="22" y="38" font-size="11" fill="#234E3B">城东片区</text>
                <rect x="102" y="12" width="86" height="42" rx="4" fill="#A93226" opacity=".78"/><text x="114" y="38" font-size="11" fill="#fff">城中片区</text>
                <rect x="194" y="12" width="96" height="42" rx="4" fill="#8CBBA1"/><text x="206" y="38" font-size="11" fill="#234E3B">城西片区</text>
                <rect x="10" y="60" width="86" height="42" rx="4" fill="#E3B98F"/><text x="22" y="86" font-size="11" fill="#7A4E1C">城南片区</text>
                <rect x="102" y="60" width="86" height="42" rx="4" fill="#5E9B78"/><text x="114" y="86" font-size="11" fill="#fff">城北片区</text>
                <rect x="194" y="60" width="96" height="42" rx="4" fill="#D9E8DE"/><text x="206" y="86" font-size="11" fill="#5C6B63">开发区</text>
                <rect x="10" y="108" width="280" height="46" rx="4" fill="#F1F7F3" stroke="#E3EBE6"/>
                <text x="22" y="128" font-size="10.5" fill="#8A9990">颜色越深，未关闭问题越多</text>
                <text x="22" y="145" font-size="10.5" fill="#A93226">城中片区 14 件 · 其中重大 6 件</text>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
