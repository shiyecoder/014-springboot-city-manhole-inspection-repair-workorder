<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人中心</title>
<link rel="stylesheet" href="../assets/app.css">
<style>
  .content{padding:20px 24px}
  .split{grid-template-columns:300px 1fr}
  .profcard{background:#fff;border:1px solid #E3EBE6;border-radius:8px;padding:24px 20px;text-align:center}
  .profcard .av{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid #E3EBE6;margin:0 auto 10px;display:block;background:#DDE9E1}
  .profcard h3{font-size:16px;font-weight:600}
  .profcard p{font-size:12.5px;color:#8A9990;margin-top:3px}
  .profcard .meta{margin-top:14px;border-top:1px solid #EEF4F0;padding-top:12px;text-align:left}
  .frow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-bottom:14px}
  .frow>label{font-size:13px;color:#5C6B63;text-align:right}
  .frow .input,.frow .select{width:100%;max-width:380px}
</style>
</head>
<body data-role="admin" data-active="个人中心">
<div class="layout">
  <div class="main">
    <div class="content">
      <div class="pagehead">
        <div><h1>个人中心</h1><p>维护姓名、联系方式、头像与登录密码</p></div>
      </div>
      <div class="grid split">
        <div class="profcard">
          <img class="av" src="../assets/avatar.png" alt="头像" onerror="this.style.background='#DDE9E1'">
          <h3>张启明</h3>
          <p>市政设施管理科 · 管理员</p>
          <div style="margin-top:14px"><button class="btn sm">更换头像</button></div>
          <div class="meta">
            <ul class="list-plain">
              <li><span>账号</span><b>admin</b></li>
              <li><span>手机号</span><b>138****6621</b></li>
              <li><span>最近登录</span><b>2026-10-31 20:02</b></li>
              <li><span>数据范围</span><b>全部片区</b></li>
            </ul>
          </div>
          <div class="hint" style="text-align:left;margin-top:10px">头像上传成功后立即同步到右上角，文件保存在项目 uploads/avatar 目录。</div>
        </div>

        <div>
          <div class="card">
            <div class="card-h"><h3>基本资料</h3></div>
            <div class="frow"><label>姓名</label><input class="input" value="张启明"></div>
            <div class="frow"><label>手机号</label><input class="input" value="13800006621"></div>
            <div class="frow"><label>邮箱</label><input class="input" value="zhangqm@city.gov.cn"></div>
            <div class="frow"><label>所属部门</label><select class="select"><option>市政设施管理科</option><option>养护调度中心</option><option>质量监督组</option></select></div>
            <div class="frow"><label>角色</label><input class="input" value="管理员" readonly style="background:#F7FAF8"></div>
            <button class="btn primary" style="margin-left:122px">保存资料</button>
          </div>

          <div class="card">
            <div class="card-h"><h3>修改密码</h3></div>
            <div class="frow"><label>当前密码</label><input class="input" type="password" value="········"></div>
            <div class="frow"><label>新密码</label><input class="input" type="password" placeholder="8–20 位，含字母与数字"></div>
            <div class="frow"><label>确认新密码</label><input class="input" type="password"></div>
            <div class="inline" style="margin-left:122px"><button class="btn primary">更新密码</button><span class="muted">修改后需重新登录</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/icons.js"></script>
<script src="../assets/shell.js"></script>
</body>
</html>
